name: scientific-regression

on:
  push:
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the packages the invariant tests import
        run: python -m pip install torch numpy pyyaml
      - name: Run the scientific regression suite
        run: python -m unittest discover -s tests/scientific -v

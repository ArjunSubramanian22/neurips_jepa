# Predeclared excitation sweep. Criteria are fixed before any candidate is measured.
experiment_id: excitation_calibration_v1
split_version: not_applicable
split_version_reason: >
  Simulator forks only. No train, validation, or test episodes are scored,
  and no learned checkpoint is loaded.
seed: 0
horizon: 4
forks:
  - identical
  - force_reversed
  - contact_shifted
  - zero_force
selection_fork: force_reversed
grid:
  damping: [0.08, 0.03, 0.01]
  action_gain: [55.0, 200.0, 800.0, 3200.0]
  contact_radius: [0.10, 0.16]
  command_hold: [3, 8]
  contact_weight_mode: [normalized]
  center_influence: [1.0]
  force_influence: [1.0]
extra:
  - {damping: 0.08, action_gain: 55.0, contact_radius: 0.10, command_hold: 1, contact_weight_mode: normalized, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.08, action_gain: 55.0, contact_radius: 0.10, command_hold: 16, contact_weight_mode: normalized, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.03, action_gain: 200.0, contact_radius: 0.10, command_hold: 16, contact_weight_mode: normalized, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.01, action_gain: 200.0, contact_radius: 0.10, command_hold: 16, contact_weight_mode: normalized, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.03, action_gain: 200.0, contact_radius: 0.10, command_hold: 3, contact_weight_mode: normalized, center_influence: 0.5, force_influence: 1.0}
  - {damping: 0.03, action_gain: 200.0, contact_radius: 0.10, command_hold: 8, contact_weight_mode: normalized, center_influence: 0.5, force_influence: 1.0}
  - {damping: 0.03, action_gain: 55.0, contact_radius: 0.10, command_hold: 3, contact_weight_mode: local_peak, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.03, action_gain: 200.0, contact_radius: 0.10, command_hold: 3, contact_weight_mode: local_peak, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.03, action_gain: 200.0, contact_radius: 0.06, command_hold: 3, contact_weight_mode: normalized, center_influence: 1.0, force_influence: 1.0}
  - {damping: 0.08, action_gain: 55.0, contact_radius: 0.10, command_hold: 3, contact_weight_mode: normalized, center_influence: 1.0, force_influence: 2.0}
stability:
  max_clip_fraction: 0.05
  max_svd_clip_fraction: 0.20
  max_speed: 25.0
  max_median_rms_pos: 0.20
selection:
  low:
    raster_change_max: 0.10
    pixel_rms_max: 0.02
    target_pixel_rms: 0.01
  medium:
    raster_change_min: 0.05
    raster_change_max: 0.40
    pixel_rms_min: 0.08
    pixel_rms_max: 0.35
    target_pixel_rms: 0.16
  high:
    raster_change_min: 0.05
    raster_change_max: 0.50
    pixel_rms_min: 0.45
    pixel_rms_max: 2.0
    target_pixel_rms: 0.75
  persistent:
    min_command_hold: 8
    max_damping: 0.03
    min_pixel_rms: 0.08
    max_pixel_rms: 2.0
    target_pixel_rms: 0.40
excitation_index: "(action_gain/55) * (0.08/damping) * (command_hold/3) * (contact_radius/0.10)"
notes: >
  Selection uses force_reversed fork medians and does not use a learned model.
  A one-state range check showed uint8 change saturating near 0.18 while pixel
  RMS kept scaling up to gain 3200, so the bins are pixel-RMS intervals with a
  raster-change cap. mpm_legacy is preferred for the low bin when it qualifies.
  Empty bins stay UNFILLED. Gain 3200 is inside the grid because gain 800
  remained below the high pixel floor on that range check.

experiment_id: capacity_small_v1
split_version: legacy_v1
selection_role: val
select_on_test: false
is_test_set: false
scale: small
varied_factor: width
width: 64
fixed:
  encoder_depth: 4
  predictor_depth: 4
  encoder_num_heads: 4
  predictor_num_heads: 4
  mlp_ratio: 2.0
  action_embed_dim: 64
  drop_path: 0.05
model:
  in_channels: 3
  img_size: 64
  patch_size: 8
  embed_dim: 64

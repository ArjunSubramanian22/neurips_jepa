# Direct observation-space predictor.
# Same legacy split, observations, action normalization, and force-reversal
# intervention family as the other baselines. No checkpoint has been trained.
experiment_id: obs_pred_v1
split_version: legacy_v1
selection_role: val
select_on_test: false
is_test_set: false
seed_registry: configs/seeds/obs_pred_v1.yaml
observation_space: raster
rgb_status: not_trained_requires_particle_positions
primary_intervention: force_reversal
prediction: next_frame
optional_horizon: 4
parameter_count: 673923
metrics:
  - pixel_mse
  - psnr
  - ssim
  - counterfactual_observation_accuracy
  - action_retrieval
  - planning
same_two_way_comparison: true
model:
  in_channels: 3
  img_size: 64
  patch_size: 8
  embed_dim: 128
  encoder_depth: 4
  encoder_num_heads: 4
  mlp_ratio: 2.0
  action_dim: 4
  action_embed_dim: 64
  predictor_embed_dim: 128
  predictor_depth: 4
  predictor_num_heads: 4
  latent_dim: 0
  ema_momentum: 0.996
  dropout: 0.0
  drop_path: 0.0
  backbone: vit
  fuse_mode: concat
  condition_on_action: true
  obs_pred_width: 32
training:
  batch_size: 32
  epochs: 200
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.05
  warmup_epochs: 20
  warmup_ratio: 0.1
  grad_clip: 1.0
  loss_type: obs_pred
  amp: true
  seed: 42
  num_workers: 2
  log_interval: 20
  ckpt_interval: 25
  output_dir: outputs
  device: auto
  obs_pred_horizon: 1
  obs_pred_teacher_force: true
  observation_space: raster
data:
  split_version: legacy_v1
  dataset_path: outputs/physics_mpm
  spatial_dims: 2
  img_size: 64
  in_channels: 3
  action_dim: 4
  n_episodes: 2000
  episode_length: 16
  n_stiffness_classes: 3
  chunk_length: 16
  chunk_stride: 1
  val_fraction: 0.1
  augment: true
  crop_scale_min: 1.0
  normalize_actions: true
  pin_memory: true
notes: >
  The dump image is the physical raster. RGB prediction uses the same U-Net
  on rgb_v1 frames rendered from positions; those positions are not in the
  image dump, so RGB training is not started. Planning cost is pixel error
  of the last predicted frame. No checkpoint has been trained.
